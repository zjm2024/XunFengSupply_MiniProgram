<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>薰风 · 启动 / 加载页</title>
<style>
  :root {
    --brand: #c8171e;
    --brand-deep: #a90f16;
    --brand-soft: #fff1f2;
    --ink: #16181d;
    --muted: #8b919b;
    --line: rgba(200, 23, 30, .12);
    --shadow: 0 24px 70px rgba(80, 20, 24, .09);
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body {
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: #f6f7f9;
    color: var(--ink);
    overflow: hidden;
  }

  /* 真实页面主体：手机与 iPad 共用一套 DOM，仅用断点适配 */
  .app {
    width: 100%;
    height: 100svh;
    min-height: 100%;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 76% 22%, rgba(200,23,30,.055), transparent 30%),
      linear-gradient(180deg, #fff 0%, #fffdfd 100%);
    isolation: isolate;
  }

  .safe {
    position:absolute;
    inset:0;
    padding:
      max(26px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(24px, env(safe-area-inset-left));
  }

  .scene {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .scene.hidden {
    opacity:0;
    pointer-events:none;
    transform: translateY(8px) scale(.985);
  }

  .brand-block {
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .logo {
    width: 92px;
    height: 92px;
    object-fit: contain;
    display:block;
    filter: drop-shadow(0 14px 22px rgba(200,23,30,.12));
  }
  .brand-name {
    margin-top: 18px;
    font-size: 34px;
    line-height:1;
    font-weight: 720;
    letter-spacing: .08em;
  }
  .subtitle {
    margin-top: 12px;
    font-size: 17px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .tagline {
    margin-top: 34px;
    font-size: 13px;
    color: #9aa0aa;
    letter-spacing: .13em;
  }

  /* 启动页背景红色丝带 */
  .ribbon {
    position:absolute;
    left:-6%;
    right:-6%;
    bottom: 8%;
    height: 34%;
    z-index:0;
    opacity:.95;
    pointer-events:none;
  }
  .ribbon::before,
  .ribbon::after {
    content:"";
    position:absolute;
    inset:auto 0 0;
    height:68%;
    border-radius: 50% 55% 0 0 / 55% 68% 0 0;
    background: linear-gradient(120deg, rgba(200,23,30,.02), rgba(200,23,30,.11));
    transform: rotate(-5deg);
  }
  .ribbon::after {
    height:52%;
    opacity:.75;
    transform: rotate(4deg) translateY(28%);
    background:
      repeating-linear-gradient(
        -10deg,
        rgba(200,23,30,.08) 0 1px,
        transparent 1px 6px
      );
  }

  /* 加载页 */
  .loading-wrap {
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .loader {
    width:64px;
    height:64px;
    margin-top:44px;
    border-radius:50%;
    border: 3px solid rgba(200,23,30,.12);
    border-top-color: var(--brand);
    border-right-color: var(--brand);
    animation: spin .85s linear infinite;
    box-shadow: 0 10px 28px rgba(200,23,30,.08);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-title {
    margin-top:18px;
    font-size:16px;
    font-weight:650;
  }
  .loading-tip {
    margin-top:8px;
    color:#a0a5ad;
    font-size:13px;
  }

  /* iPad：视觉重心左移，增强横屏空间感 */
  @media (min-width: 768px) and (orientation: landscape) {
    .scene.startup {
      justify-content:flex-start;
      padding-left: 14vw;
    }
    .scene.startup .brand-block {
      align-items:flex-start;
      text-align:left;
    }
    .scene.startup .tagline {
      position:relative;
      padding-left:20px;
    }
    .scene.startup .tagline::before {
      content:"";
      position:absolute;
      left:0; top:50%;
      width:10px; height:2px;
      border-radius:99px;
      background:var(--brand);
    }
    .scene.loading {
      justify-content:center;
    }
    .logo { width:104px; height:104px; }
    .brand-name { font-size:38px; }
    .subtitle { font-size:18px; }
    .ribbon {
      left:28%;
      right:-8%;
      bottom:4%;
      height:70%;
    }
    .ribbon::before {
      transform: rotate(-8deg);
      border-radius: 50% 0 0 0 / 60% 0 0 0;
    }
  }

  /* 大尺寸 iPad */
  @media (min-width: 1024px) {
    .scene.startup { padding-left: 15vw; }
    .logo { width:118px; height:118px; }
    .brand-name { font-size:42px; }
    .subtitle { font-size:19px; }
    .tagline { margin-top:42px; font-size:14px; }
  }

  /* 小屏手机 */
  @media (max-width: 430px) {
    .logo { width:82px; height:82px; }
    .brand-name { font-size:31px; }
    .subtitle { font-size:15px; }
    .tagline {
      position:absolute;
      left:0; right:0;
      bottom:max(24px, env(safe-area-inset-bottom));
      margin:0;
    }
    .ribbon { bottom:8%; height:36%; }
  }

  /* 演示切换器：方便你在浏览器里查看两个状态 */
  .demo-switch {
    position:fixed;
    z-index:20;
    top:max(14px, env(safe-area-inset-top));
    right:max(14px, env(safe-area-inset-right));
    display:flex;
    gap:4px;
    padding:4px;
    border:1px solid rgba(20,20,20,.06);
    background:rgba(255,255,255,.78);
    backdrop-filter: blur(16px);
    border-radius:14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.06);
  }
  .demo-switch button {
    appearance:none;
    border:0;
    padding:8px 11px;
    border-radius:10px;
    color:#6d727a;
    background:transparent;
    font: 600 12px/1 inherit;
    cursor:pointer;
  }
  .demo-switch button.active {
    color:#fff;
    background:var(--brand);
    box-shadow:0 5px 14px rgba(200,23,30,.2);
  }
</style>
</head>

<script>
  const startup = document.getElementById('startup');
  const loading = document.getElementById('loading');
  const btnStartup = document.getElementById('btnStartup');
  const btnLoading = document.getElementById('btnLoading');

  function show(type) {
    const isStartup = type === 'startup';
    startup.classList.toggle('hidden', !isStartup);
    loading.classList.toggle('hidden', isStartup);
    btnStartup.classList.toggle('active', isStartup);
    btnLoading.classList.toggle('active', !isStartup);
  }

  btnStartup.onclick = () => show('startup');
  btnLoading.onclick = () => show('loading');

  // 演示：首次打开 2.2 秒后自动从启动页进入加载页
  const params = new URLSearchParams(location.search);
  if (params.get('auto') !== '0') {
    setTimeout(() => show('loading'), 2200);
  }
</script>
