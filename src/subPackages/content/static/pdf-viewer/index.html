<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>产品手册</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <header class="viewer-header">
      <button id="backButton" type="button" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6" /></svg>
      </button>
      <div class="viewer-title">产品手册</div>
    </header>
    <div id="progressText" class="viewer-progress" role="status" aria-live="polite">准备中</div>
    <div id="cacheStatus" class="cache-status" role="status" aria-live="polite" hidden></div>
    <nav id="zoomToolbar" class="zoom-toolbar" hidden>
      <button id="zoomOut" type="button">−</button>
      <span id="zoomLevel" aria-live="polite">100%</span>
      <button id="zoomIn" type="button">＋</button>
      <button id="zoomFit" type="button"></button>
    </nav>
    <button id="originalButton" class="original-button" type="button" hidden></button>
    <main id="pages" class="pdf-pages"></main>
    <div id="errorBox" class="error-box" hidden></div>
    <button id="embeddedBackButton" class="embedded-back" type="button">返回</button>
    <script src="./uniWebview.js"></script>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
